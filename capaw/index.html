function croll(idparent, idcroll) {
const container = document.querySelector(idparent);
const content = document.querySelector(idcroll);
const scrollToBottom = () => {
  container.scrollTo({
    top: container.scrollHeight,
    behavior: 'smooth'
  });
};
const observer = new MutationObserver(() => {
  const threshold = 999;
  const position = container.scrollTop + container.clientHeight;
  const isAtBottom = container.scrollHeight - position <= threshold;
  if (isAtBottom) {
    scrollToBottom();
  } else {
    console.log("User sedang melihat ke atas, auto-scroll dihentikan sementara.");
  }
});
observer.observe(content, {
  childList: true,
  subtree: true,
  characterData: true
});
}
$('#bstar').on('scroll', function() {
  // Hitung persentase scroll di elemen kiri
  var scrollTop = $(this).scrollTop();
  var scrollHeight = $(this)[0].scrollHeight - $(this).outerHeight();
  var scrollPercent = scrollTop / scrollHeight;
  
  // Terapkan persentase tersebut ke elemen kanan
  var target = $('#clnbstar');
  var targetHeight = target[0].scrollHeight - target.outerHeight();
  target.scrollTop(scrollPercent * targetHeight);
});
