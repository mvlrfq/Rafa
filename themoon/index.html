<script>
  function teksisi(durasi, idteks, teksAsli, lanjut, idkursor, kursor,) {
  $(idkursor).html(kursor)
  let i = 0;
  function ketik() {
    if (i < teksAsli.length) {
      if (teksAsli.substr(i, 4) === "<br>") {
        $(idteks).html(teksAsli.substr(0, i + 4));
        i += 4;
      } else {
        $(idteks).html(teksAsli.substr(0, i + 1));
        i++;
      }
      setTimeout(ketik, durasi);
    } else {
      lanjut()
    }
  }
   ketik();
 }

const container = document.getElementById('bteks');
const content = document.getElementById('bstar');
const scrollToBottom = () => {
  container.scrollTo({
    top: container.scrollHeight,
    behavior: 'smooth'
  });
};
const observer = new MutationObserver(() => {
  const threshold = 999;
  const position = container.scrollTop + container.clientHeight;
  const isAtBottom = container.scrollHeight - position <= threshold;
  if (isAtBottom) {
    scrollToBottom();
  } else {
    console.log("User sedang melihat ke atas, auto-scroll dihentikan sementara.");
  }
});
observer.observe(content, {
  childList: true,
  subtree: true,
  characterData: true
});
