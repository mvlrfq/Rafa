<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bgudung</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; /* Warna latar belakang */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        h2 {
            color: #d81b60;
            margin-bottom: 20px;
        }

        /* Container untuk Gambar Surat */
        .surat-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .surat-wrapper:hover {
            transform: scale(1.05); /* Efek membesar saat kursor di atasnya */
        }

        .surat-wrapper:active {
            transform: scale(0.95); /* Efek membal saat diklik */
        }

        /* Styling Gambar Surat */
        .surat-img {
            width: 250px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>klick surat dibawah ini! ✉️</h2>

        <!-- Area Gambar Surat -->
        <div class="surat-wrapper" onclick="putarAudioFullVolume()">
            <!-- Gambar Amplop Surat -->
            <img src="https://cdn-icons-png.flaticon.com/512/646/646094.png" alt="Gambar Surat" class="surat-img">
        </div>
    </div>

    <!-- Elemen Audio (Sembunyi) -->
    <audio id="myAudio" loop>
        <!-- Ganti tautan di bawah ini dengan file mp3 kamu -->
        <source src="https://mvlrfq.github.io/Rafa/bgd.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script>
        function putarAudioFullVolume() {
            var audio = document.getElementById("myAudio");

            // Hanya putar jika audio belum/sedang tidak berjalan
            if (audio.paused) {
                // Atur volume audio ke tingkat MAKSIMAL (1.0 = 100%)
                audio.volume = 1.0;
                
                // Memutar audio
                audio.play();

                // Menonaktifkan efek klik pada wrapper surat agar tidak bisa diklik lagi
                document.querySelector('.surat-wrapper').onclick = null;
                document.querySelector('.surat-wrapper').style.cursor = "default";
            }
        }
    </script>

</body>
</html>
