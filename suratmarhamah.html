:root {
            --warna-amplop: #f0c27b;
            --warna-amplop-dalam: #cf9e59;
            --warna-kertas: #ffffff;
        }


        /* Container Utama */
        .wrapper {
            
            position: absolute;
            cursor: pointer;
            top: 100px;
        }

        .envelope {
            position: relative;
            width: 250px;
            height: 150px;
            background-color: var(--warna-amplop);
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        /* Penutup Amplop (Segitiga Atas) */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            border-left: 125px solid transparent;
            border-right: 125px solid transparent;
            border-top: 80px solid var(--warna-amplop);
            transform-origin: top;
            transition: transform 0.4s ease-in-out;
            z-index: 3;
        }

        /* Bagian Samping dan Bawah Amplop */
        .envelope::before {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            border-left: 125px solid transparent;
            border-right: 125px solid var(--warna-amplop-dalam);
            border-top: 75px solid transparent;
            border-bottom: 75px solid var(--warna-amplop-dalam);
            z-index: 2;
        }

        .envelope::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            border-left: 125px solid var(--warna-amplop-dalam);
            border-right: 125px solid transparent;
            border-top: 75px solid transparent;
            border-bottom: 75px solid var(--warna-amplop-dalam);
            z-index: 2;
        }

        /* Kertas di Dalam */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 80%;
            background: var(--warna-kertas);
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            transition: transform 0.4s ease-in-out;
            z-index: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Efek Hover */
        .wrapper:hover .flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .wrapper:hover .letter {
            transform: translate(-50%, -100px); /* Kertas naik ke atas */
            z-index: 2;
        }

        .letter h1 {
            font-size: 16px;
            color: #d81b60;
        }

            color: #333;
        }

          top: 270px;
          border-radius: 7px;
          background-color: darkgray;
          padding: 10px;
        }

const container = document.getElementById('scroll');
const content = document.getElementById('scrollank');

// 1. Fungsi untuk eksekusi scroll
const scrollToBottom = () => {
  container.scrollTo({
    top: container.scrollHeight,
    behavior: 'smooth' // Gunakan 'smooth' untuk animasi halus
  });
};

// 2. Observer untuk mengecek perubahan elemen secara terus-menerus
const observer = new MutationObserver(() => {
  // LOGIKA USER INTENT:
  // Kita hitung jarak antara posisi scroll user dengan bagian paling bawah
  const threshold = 50; // Toleransi jarak dalam pixel
  const position = container.scrollTop + container.clientHeight;
  const isAtBottom = container.scrollHeight - position <= threshold;
  
  // Hanya scroll otomatis JIKA user berada di area bawah
  if (isAtBottom) {
    scrollToBottom();
  } else {
    console.log("User sedang melihat ke atas, auto-scroll dihentikan sementara.");
  }
});

// 3. Mulai mengamati perubahan pada elemen 'content'
observer.observe(content, {
  childList: true, // Deteksi elemen baru
  subtree: true, // Deteksi perubahan di dalam anak elemen
  characterData: true // Deteksi jika teks di dalamnya berubah
});
